[project]
name = "otisweb"
version = "1.9.0"
description = "OTIS-WEB Course Management System"
authors = [{ name = "Evan Chen", email = "evan@evanchen.cc" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13, <4.0"

dependencies = [
  "Django>=6.0.10,<6.1.0",
  "Unidecode>=1.4.0",
  "crispy-bootstrap5>=2026.9",
  "django-allauth[socialaccount]>=65.21.1",
  "django-bootstrap5>=26.4",
  "django-bot-rickroll>=0.3.1",
  "django-braces>=1.17.0",
  "django-crispy-forms>=2.7",
  "django-debug-toolbar>=8.0.0",
  "django-discordo>=1.2.1",
  "django-extensions>=4.1",
  "django-hijack>=3.7.9,<3.8",
  "django-import-export>=4.4.4",
  "django-markdownfield>=0.21.1",
  "django-markdownify>=0.9.7",
  "django-positions>=0.6.0",
  "django-qr-code>=5.0.0",
  "django-registration>=5.2.1",
  "django-reversion>=6.5.1",
  "django-sql-utils>=0.7.0",
  "django-storages[google,s3]>=1.14.6",
  "django-stubs>=6.1.2,<7.0.0",
  "django-stubs-ext>=6.1.2,<7.0.0",
  "pillow>=13.0.0",
  "prettytable>=3.18.0",
  "pypdf>=6.21.4",
  "python-dotenv>=1.2.4",
  "reportlab>=5.1.0",
  "setuptools>=84.2.1",
  "stripe==5.5.0",
  "wheel>=0.48.0",
]

[project.optional-dependencies]
prod = [
  "mysqlclient>=2.3.0",
]

[dependency-groups]
dev = [
  "Faker>=40.44.0",
  "coverage[toml]>=7.17.2",
  "factory-boy>=3.3.3",
  "freezegun>=1.5.5",
  "ipython>=9.18.1",
  "jedi>=0.20.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-xdist>=3.8.0",
  "pyright>=1.1.414",
  "tblib>=3.2.2",
  "toml>=0.10.2",
  "types-Markdown>=3.11.2.20261029",
  "types-freezegun>=1.1.10",
  "types-requests>=2.33.0.20261030",
  "werkzeug>=3.1.9",
  "prek>=0.5.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "otisweb.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["."]
addopts = "--reuse-db"

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.coverage.run]
branch = true
omit = [
  "**/site-packages/**",
  "*/migrations/*",
  "otisweb_testsuite/**",
  "manage.py",
  "*/admin.py",
  "fixtures/gen-dummy-data.sh",
]

[tool.pyright]
enableTypeIgnoreComments = true
exclude = ["**/node_modules", "**/typings", "**/__pycache__", ".git", "venv", ".venv", "**/migrations", "**/tests.py", "**/tests_*.py", "**/test_*.py"]
pythonPlatform = "Linux"
pythonVersion = "3.13"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

reportAssertAlwaysTrue = "error"
reportCallInDefaultInitializer = "warning"
reportConstantRedefinition = "none"
reportDuplicateImport = "error"
reportFunctionMemberAccess = "none"
reportGeneralTypeIssues = "error"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
reportIncompatibleMethodOverride = "none"
reportIncompatibleVariableOverride = "none"
reportIncompleteStub = "none"
reportInvalidStringEscapeSequence = "error"
reportInvalidTypeVarUse = "warning"
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportOptionalCall = "error"
reportOptionalContextManager = "error"
reportOptionalIterable = "error"
reportOptionalMemberAccess = "error"
reportOptionalOperand = "error"
reportOptionalSubscript = "error"
reportOverlappingOverload = "error"
reportPrivateUsage = "error"
reportPropertyTypeMismatch = "error"
reportSelfClsParameterName = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "error"
reportUnknownVariableType = "none"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
reportUntypedBaseClass = "none"
reportUntypedClassDecorator = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedNamedTuple = "error"
reportUnusedCallResult = "none"
reportUnusedClass = "error"
reportUnusedCoroutine = "error"
reportUnusedFunction = "error"
reportUnusedImport = "warning"
reportUnusedVariable = "error"
reportWildcardImportFromLibrary = "warning"
strictDictionaryInference = false
strictListInference = false
strictParameterNoneValue = false
strictSetInference = false

[tool.codereviewdoctor]
disable = ["tall-model", "missing-related-name", "checking-settings-debug", "nullable-string-field"]

[tool.codespell]
skip = "roster/country_abbrevs.py,roster/us_states.py,*/migrations/*.py,uv.lock"
count = ""
quiet-level = 3
ignore-words-list = "assertIn"

[tool.djlint]
profile = "django"
indent = 2
ignore = "D018,H006,H013,H021"
format_css = true
format_js = true

[tool.ruff.lint]
extend-select = ["DJ"]

[tool.ruff.lint.per-file-ignores]
# Migrations are autogenerated; `dependencies` and `operations` are plain lists.
"*/migrations/*.py" = ["RUF012"]

[tool.rumdl]
disable = [
  "MD025", # Allow multiple h1 headings
  "MD026", # Permit punctuation in heading
  "MD033", # Permit inline HTML
  "MD041", # Allow first line to be anything (not just h1)
]
extend-enable = ["MD060"] # Table alignment
respect-gitignore = true

[tool.rumdl.MD013] # Line length
line-length = 160
code-blocks = false
tables = false
headings = false

[tool.rumdl.MD060] # Table alignment
enabled = true
style = "aligned"
