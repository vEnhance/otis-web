<a href="{% url "oime-proposal-list" %}"
   class="btn btn-sm {% if subject %}btn-outline-dark{% else %}btn-dark{% endif %}">All</a>
{% for code, name in subject_choices %}
  <a href="{% url "oime-subject-browse" code %}{% if browse_params %}?{{ browse_params }}{% endif %}"
     title="{{ name }}"
     class="btn btn-sm {% if code == subject %}btn-primary{% else %}btn-outline-primary{% endif %}">{{ code }}</a>
{% endfor %}
