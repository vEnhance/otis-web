{% load otis_extras %}
<div class="card">
  <b class="card-header">{{ market.title }}</b>
  <div class="card-body">{{ market.prompt_rendered|safe }}</div>
  <div class="card-footer text-muted">
    <p>{% timestamp market.start_date "time" %} – {% timestamp market.end_date "time" %}</p>
  </div>
</div>
